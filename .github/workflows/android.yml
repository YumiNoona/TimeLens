name: Android preview checks

on:
  workflow_call:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and check Android preview
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --console=plain
      - name: Name preview package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TimeLens-Android-preview.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TimeLens-Android-preview
          path: TimeLens-Android-preview.apk
          if-no-files-found: error
