name: Android build checks
on:
  workflow_call:
  push:
    branches: [master]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and validate release APK and App Bundle
        working-directory: android
        run: bash gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleDebugAndroidTest :app:assembleRelease :app:bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: Android-unsigned-validation-only
          path: |
            android/app/build/outputs/apk/release/*unsigned.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
