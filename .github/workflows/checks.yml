name: Desktop and web checks

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/TimeLens.Dashboard/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix src/TimeLens.Dashboard
      - run: npm ci --prefix web
      - run: npm audit --prefix src/TimeLens.Dashboard --audit-level=high
      - run: npm audit --prefix web --audit-level=high
      - run: npm test
      - run: npm run build --prefix src/TimeLens.Dashboard
      - run: npm run web:build
      - run: npm run test:dotnet
