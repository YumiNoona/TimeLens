name: Release verification
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    uses: ./.github/workflows/android.yml
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            src/TimeLens.Dashboard/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix web
      - run: npm audit --prefix web --audit-level=high
      - run: npm run web:build
      - name: Verify tag matches the application versions
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            [xml]$project = Get-Content src/TimeLens.TrayApp/TimeLens.TrayApp.csproj
            $version = [string]$project.Project.PropertyGroup.Version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Release tag does not match the application version' }
          }
      - name: Install installer compiler
        run: choco install innosetup --version=6.7.1 --yes --no-progress
      - name: Build production Windows and browser packages
        shell: pwsh
        run: ./scripts/publish.ps1 -Config Release -OutputDirectory .artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: Windows-and-browser-release-packages
          path: .artifacts/release/*
          if-no-files-found: error
# Signed Android APK/AAB files are verified and uploaded by the release maintainer.
# CI never attaches debug, preview or unsigned Android builds to a public release.
