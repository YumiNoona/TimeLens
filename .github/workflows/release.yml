name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/TimeLens.Dashboard/package-lock.json

      - name: Build dashboard
        working-directory: src/TimeLens.Dashboard
        run: |
          npm ci
          npm run build

      - name: Publish TrayApp (Native AOT)
        run: |
          dotnet publish src\TimeLens.TrayApp -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=true -p:PublishTrimmed=true -p:EnableCompressionInSingleFile=true

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Prepare release assets
        shell: pwsh
        run: |
          $publish = "src\TimeLens.TrayApp\bin\Release\net9.0\win-x64\publish"
          Copy-Item "$publish\TimeLens.TrayApp.exe" "TimeLens.exe"
          Compress-Archive -Path "src\browser-extensions\chrome\*" -DestinationPath "TimeLens-v${{ env.VERSION }}-extension-chrome.zip"
          Compress-Archive -Path "src\browser-extensions\chrome\*" -DestinationPath "TimeLens-v${{ env.VERSION }}-extension-edge.zip"
          Compress-Archive -Path "src\browser-extensions\firefox\*" -DestinationPath "TimeLens-v${{ env.VERSION }}-extension-firefox.zip"

          $assets = @(
            "TimeLens.exe",
            "TimeLens-v${{ env.VERSION }}-extension-chrome.zip",
            "TimeLens-v${{ env.VERSION }}-extension-edge.zip",
            "TimeLens-v${{ env.VERSION }}-extension-firefox.zip"
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            TimeLens.exe
            TimeLens-v*-extension-*.zip
            SHA256SUMS.txt
          generate_release_notes: true
