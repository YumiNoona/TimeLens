name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/TimeLens.Dashboard/package-lock.json

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build dashboard
        working-directory: src/TimeLens.Dashboard
        run: |
          npm ci
          npm run build

      - name: Verify browser extension scripts
        shell: pwsh
        run: |
          $scripts = @(
            "src\browser-extensions\shared\background.js",
            "src\browser-extensions\chrome\background.js",
            "src\browser-extensions\firefox\background.js"
          )
          foreach ($script in $scripts) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed for $script" }
          }
          $hashes = $scripts | ForEach-Object { (Get-FileHash -Algorithm SHA256 $_).Hash }
          if (($hashes | Select-Object -Unique).Count -ne 1) {
            throw "Browser extension background scripts are out of sync"
          }

      - name: Check fresh-install and database migration regressions
        run: dotnet run --project tests/TimeLens.Startup.Tests -c Release

      - name: Check tracking and local-day regressions
        run: dotnet run --project tests/TimeLens.Tracking.Tests -c Release

      - name: Publish TrayApp (Native AOT)
        run: |
          dotnet publish src\TimeLens.TrayApp -c Release -r win-x64 --self-contained true `
            -p:PublishTrimmed=true

      - name: Verify release version metadata
        shell: pwsh
        run: |
          $expected = "${{ env.VERSION }}"
          [xml]$project = Get-Content "src\TimeLens.TrayApp\TimeLens.TrayApp.csproj"
          $dashboard = Get-Content "src\TimeLens.Dashboard\package.json" | ConvertFrom-Json
          $chromeExtension = Get-Content "src\browser-extensions\chrome\manifest.json" | ConvertFrom-Json
          $firefoxExtension = Get-Content "src\browser-extensions\firefox\manifest.json" | ConvertFrom-Json
          $actual = @{
            TrayApp = [string]$project.Project.PropertyGroup.Version
            Dashboard = [string]$dashboard.version
            ChromeExtension = [string]$chromeExtension.version
            FirefoxExtension = [string]$firefoxExtension.version
          }
          foreach ($entry in $actual.GetEnumerator()) {
            if ($entry.Value -ne $expected) {
              throw "$($entry.Key) version $($entry.Value) does not match tag version $expected"
            }
          }
          Write-Host "Desktop release: $expected"

      - name: Prepare desktop executable
        shell: pwsh
        run: |
          $publish = "src\TimeLens.TrayApp\bin\Release\net9.0\win-x64\publish"
          Copy-Item "$publish\TimeLens.TrayApp.exe" "TimeLens.exe"

      - name: Package browser extensions
        shell: pwsh
        run: |
          Compress-Archive -Path "src\browser-extensions\chrome\*" -DestinationPath "TimeLens-Chrome-Extension.zip"
          Compress-Archive -Path "src\browser-extensions\firefox\*" -DestinationPath "TimeLens-Firefox-Extension.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=${{ env.VERSION }}" "installer\TimeLens.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }
          Copy-Item "installer\output\TimeLens-Setup.exe" "TimeLens-Setup.exe"

      - name: Generate release checksums
        shell: pwsh
        run: |
          $assets = @(
            "TimeLens.exe",
            "TimeLens-Setup.exe",
            "TimeLens-Chrome-Extension.zip",
            "TimeLens-Firefox-Extension.zip"
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            TimeLens.exe
            TimeLens-Setup.exe
            TimeLens-Chrome-Extension.zip
            TimeLens-Firefox-Extension.zip
            SHA256SUMS.txt
          name: TimeLens ${{ env.VERSION }} — Keep your time in focus
          body_path: docs/releases/${{ env.VERSION }}.md
          generate_release_notes: false
