name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      WINDOWS_SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
      WINDOWS_SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: src/TimeLens.Dashboard/package-lock.json

      - name: Extract version from tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV

      - name: Build dashboard
        working-directory: src/TimeLens.Dashboard
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Check .NET dependency advisories
        run: dotnet list src/TimeLens.sln package --vulnerable --include-transitive

      - name: Verify browser extension scripts
        shell: pwsh
        run: |
          $scripts = @(
            "src\browser-extensions\chrome\background.js",
            "src\browser-extensions\chrome\popup.js",
            "src\browser-extensions\chrome\blocked.js",
            "src\browser-extensions\firefox\background.js",
            "src\browser-extensions\firefox\content.js",
            "src\browser-extensions\firefox\popup.js",
            "src\browser-extensions\firefox\blocked.js"
          )
          foreach ($script in $scripts) {
            node --check $script
            if ($LASTEXITCODE -ne 0) { throw "JavaScript syntax check failed for $script" }
          }

      - name: Check browser extension behavior
        run: |
          node --test tests/browser-extension.test.mjs tests/timeline.test.mjs
          npx --yes web-ext@10.6.0 lint --source-dir src/browser-extensions/firefox

      - name: Check fresh-install and database migration regressions
        run: dotnet run --project tests/TimeLens.Startup.Tests -c Release

      - name: Check tracking and local-day regressions
        run: dotnet run --project tests/TimeLens.Tracking.Tests -c Release

      - name: Publish TrayApp (Native AOT)
        run: |
          dotnet publish src\TimeLens.TrayApp -c Release -r win-x64 --self-contained true `
            -p:PublishTrimmed=true

      - name: Verify release version metadata
        shell: pwsh
        run: |
          $expected = "${{ env.VERSION }}"
          [xml]$project = Get-Content "src\TimeLens.TrayApp\TimeLens.TrayApp.csproj"
          $dashboard = Get-Content "src\TimeLens.Dashboard\package.json" | ConvertFrom-Json
          $firefoxExtension = Get-Content "src\browser-extensions\firefox\manifest.json" | ConvertFrom-Json
          $actual = @{
            TrayApp = [string]$project.Project.PropertyGroup.Version
            Dashboard = [string]$dashboard.version
          }
          foreach ($entry in $actual.GetEnumerator()) {
            if ($entry.Value -ne $expected) {
              throw "$($entry.Key) version $($entry.Value) does not match tag version $expected"
            }
          }
          $chromeExtension = Get-Content "src\browser-extensions\chrome\manifest.json" | ConvertFrom-Json
          if ($chromeExtension.version -ne '7.1.0' -or $firefoxExtension.version -ne $chromeExtension.version) { throw "Companion version mismatch" }
          Write-Host "Firefox extension: $($firefoxExtension.version) (versioned independently)"
          Write-Host "Desktop release: $expected"

      - name: Prepare desktop executable
        shell: pwsh
        run: |
          $publish = "src\TimeLens.TrayApp\bin\Release\net9.0\win-x64\publish"
          Copy-Item "$publish\TimeLens.TrayApp.exe" "TimeLens.exe"

      - name: Sign desktop executable
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "timelens-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          if (-not $signtool) { throw "signtool.exe was not found" }
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_SIGNING_CERT_PASSWORD "TimeLens.exe"
          if ($LASTEXITCODE -ne 0) { throw "Executable signing failed" }
          Remove-Item -LiteralPath $certificate -Force

      - name: Package browser extensions
        shell: pwsh
        run: |
          Compress-Archive -Path "src\browser-extensions\chrome\*" -DestinationPath "TimeLens-Chrome-Extension.zip"
          Compress-Archive -Path "src\browser-extensions\firefox\*" -DestinationPath "TimeLens-Firefox-Extension.zip"

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --version=6.7.1 --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $compiler = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $compiler "/DAppVersion=${{ env.VERSION }}" "installer\TimeLens.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup exited with code $LASTEXITCODE" }
          Copy-Item "installer\output\TimeLens-Setup.exe" "TimeLens-Setup.exe"

      - name: Sign Windows installer
        if: ${{ env.WINDOWS_SIGNING_CERT_BASE64 != '' }}
        shell: pwsh
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP "timelens-signing.pfx"
          [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERT_BASE64))
          $signtool = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse | Where-Object FullName -Match '\\x64\\' | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          & $signtool sign /fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f $certificate /p $env:WINDOWS_SIGNING_CERT_PASSWORD "TimeLens-Setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer signing failed" }
          Remove-Item -LiteralPath $certificate -Force

      - name: Generate release checksums
        shell: pwsh
        run: |
          $assets = @(
            "TimeLens.exe",
            "TimeLens-Setup.exe",
            "TimeLens-Chrome-Extension.zip",
            "TimeLens-Firefox-Extension.zip"
          )
          $checksums = foreach ($asset in $assets) {
            $hash = (Get-FileHash -Algorithm SHA256 $asset).Hash.ToLowerInvariant()
            "$hash  $asset"
          }
          $checksums | Set-Content -Encoding ascii "SHA256SUMS.txt"

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            TimeLens.exe
            TimeLens-Setup.exe
            TimeLens-Chrome-Extension.zip
            TimeLens-Firefox-Extension.zip
            SHA256SUMS.txt
          name: TimeLens ${{ env.VERSION }} — Keep your time in focus
          body_path: docs/releases/${{ env.VERSION }}.md
          generate_release_notes: false
