<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Focus Mode · TimeLens</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Segoe UI",sans-serif;background:#081012;color:#edf6f4}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 18% 22%,rgba(110,213,215,.14),transparent 30%),#081012}
    main{width:min(620px,100%);display:grid;grid-template-columns:160px 1fr;gap:28px;align-items:center;padding:28px;border:1px solid #27383b;border-radius:24px;background:rgba(15,25,28,.94);box-shadow:0 28px 80px rgba(0,0,0,.42)}
    .visual{width:160px;height:160px;display:grid;place-items:center;border-radius:20px;background:#122226;overflow:hidden;color:#7fd6d8}.visual img{width:100%;height:100%;object-fit:cover}.visual svg{width:62px;height:62px}
    .eyebrow{margin:0 0 8px;color:#7fd6d8;font-size:11px;font-weight:700;letter-spacing:.14em}h1{margin:0 0 9px;font-size:30px;line-height:1.12}p{margin:0;color:#a6b6b3;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
    .target{display:inline-flex;margin-top:20px;padding:7px 10px;border:1px solid #2d4245;border-radius:999px;color:#c7d5d2;background:#101b1e;font:12px ui-monospace,SFMono-Regular,Consolas,monospace}
    .hint{margin-top:14px;color:#627471;font-size:11px}
    @media(max-width:620px){main{grid-template-columns:1fr;text-align:center}.visual{width:120px;height:120px;margin:auto}.target{justify-self:center}h1{font-size:25px}}
  </style>
</head>
<body>
  <main>
    <div class="visual" id="visual">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9.5 12 1.6 1.6 3.6-4"/></svg>
    </div>
    <section><div class="eyebrow">TIMELENS · STRICT</div><h1 id="title">Stay focused</h1><p id="message">This website is blocked while Focus Mode is active.</p><div class="target" id="target"></div><div class="hint">This page unlocks automatically when you remove the target or turn Focus Mode off.</div></section>
  </main>
  <script src="blocked.js"></script>
</body>
</html>
